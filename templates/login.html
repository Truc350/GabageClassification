<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đăng nhập quản trị</title><link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}"><link rel="stylesheet" href="{{ url_for('static', filename='admin.css') }}"></head>
<body class="login-page"><main class="login-wrap"><form method="post" class="panel login-card"><span class="eyebrow">QUẢN TRỊ HỆ THỐNG</span><h1>Đăng nhập</h1><p>Đăng nhập để quản lý điểm thu gom và danh mục rác.</p>{% if error %}<p class="notice">{{ error }}</p>{% endif %}<label>Tên đăng nhập<input name="username" autocomplete="username" required autofocus></label><label>Mật khẩu<input name="password" type="password" autocomplete="current-password" required></label><button class="primary" type="submit">Đăng nhập</button><a class="back-link" href="/">← Quay lại trang nhận diện</a></form></main></body></html>
