<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quản trị phân loại rác</title><link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}"><link rel="stylesheet" href="{{ url_for('static', filename='admin.css') }}"><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js" defer></script><script src="{{ url_for('static', filename='admin.js') }}" defer></script></head><body>
<header class="site-header"><div><span class="eyebrow">QUẢN TRỊ HỆ THỐNG</span><h1>Dashboard phân loại rác</h1></div><a class="back-link" href="/">← Trang nhận diện</a></header><main>
<section class="stat-grid"><article class="panel stat"><span>Tổng lượt nhận diện</span><strong id="totalRecognitions">0</strong></article><article class="panel stat"><span>Người dùng hoạt động</span><strong id="activeUsers">0</strong></article><article class="panel stat"><span>Số danh mục</span><strong id="categoryCount">0</strong></article></section>
<section class="admin-chart-grid"><article class="panel chart-panel"><h2>Tỷ lệ loại rác</h2><div class="chart-box"><canvas id="systemPie"></canvas></div></article><article class="panel chart-panel"><h2>Số lượt theo ngày</h2><div class="chart-box"><canvas id="systemBar"></canvas></div></article></section>
<section class="panel category-manager"><div class="section-title"><div><span class="eyebrow">CẤU HÌNH</span><h2>Quản lý danh mục rác</h2></div><button id="newCategory" class="primary">Thêm danh mục</button></div><p id="adminNotice" class="notice"></p><div class="table-wrap"><table><thead><tr><th>Nhãn model</th><th>Tên hiển thị</th><th>Màu thùng</th><th>Mô tả</th><th></th></tr></thead><tbody id="categoryBody"></tbody></table></div></section>
<dialog id="categoryDialog"><form id="categoryForm"><input id="categoryId" type="hidden"><h2 id="dialogTitle">Thêm danh mục</h2><label>Nhãn model<input id="categoryLabel" required placeholder="plastic"></label><label>Tên hiển thị<input id="categoryName" required placeholder="Nhựa"></label><div class="form-row"><label>Màu thùng<input id="binColor" required placeholder="Vàng"></label><label>Màu giao diện<input id="colorHex" type="color" value="#16835b"></label></div><label>Mô tả<textarea id="description" rows="3"></textarea></label><div class="dialog-actions"><button type="button" id="cancelDialog" class="secondary">Hủy</button><button class="primary">Lưu</button></div></form></dialog>
</main></body></html>
